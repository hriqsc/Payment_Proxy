[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.8"
redis = { version = "1.0.4", features = ["tokio-comp"]}
reqwest = {version = "0.13.2", features = ["json"]}
serde = { version = "1.0.188", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"